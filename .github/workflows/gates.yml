name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gate tooling
        run: pip install ruff==0.16.3 pyright==1.1.411 pytest==8.3.4

      - name: make gate
        run: make gate

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics
          path: evals/out/
          if-no-files-found: warn
